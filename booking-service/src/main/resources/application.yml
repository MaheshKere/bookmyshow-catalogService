spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5433/booking_db}
    username: ${BOOKING_DB_USERNAME:booking_user}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      connection-init-sql: "SET lock_timeout TO '5s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${BOOKING_SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
booking:
  expiration:
    enabled: true
    delay-ms: 30000
