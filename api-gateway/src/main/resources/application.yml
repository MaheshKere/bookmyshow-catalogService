spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
server:
  port: ${GATEWAY_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
downstream:
  identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8083}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:8082}

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    issuer: ${JWT_ISSUER:bookmyshow-identity}
    audience: ${JWT_AUDIENCE:bookmyshow-api}
