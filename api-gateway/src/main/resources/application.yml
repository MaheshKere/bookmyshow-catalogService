spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
      repositories:
        enabled: false
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
server:
  port: ${GATEWAY_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
downstream:
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8083}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:8082}

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    issuer: ${JWT_ISSUER:bookmyshow-identity}
    audience: ${JWT_AUDIENCE:bookmyshow-api}

gateway:
  movie-rate-limit:
    enabled: ${MOVIE_RATE_LIMIT_ENABLED:true}
    limit: ${MOVIE_RATE_LIMIT:60}
    window: ${MOVIE_RATE_WINDOW:PT1M}
