spring:
  datasource:
    url: "jdbc:postgresql://[::1]:5432/catalog_db"
    username: catalog_user
    password: catalog_password
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bookmyshow.catalog: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
