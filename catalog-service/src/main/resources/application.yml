spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
      repositories:
        enabled: false
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    issuer: ${JWT_ISSUER:bookmyshow-identity}
    audience: ${JWT_AUDIENCE:bookmyshow-api}

catalog:
  movie-cache:
    enabled: ${MOVIE_CACHE_ENABLED:true}
    ttl: ${MOVIE_CACHE_TTL:PT5M}
learning:
  movie-report:
    enabled: ${MOVIE_REPORT_ENABLED:false}
    interval-ms: ${MOVIE_REPORT_INTERVAL_MS:60000}
    lease: ${MOVIE_REPORT_LEASE:PT30S}
